<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої листи | Наша історія</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="letters.css" />
  </head>
  <body data-page="letters" class="story-game">
    <div class="page-shell letters-page">
      <header class="letters-header">
        <a href="map.html" class="back-btn">← Назад</a>
        <h1>💌 Мої листи</h1>
      </header>

      <main class="letters-container">
        <p class="letters-intro">Листи, написані для тебе з усім моїм серцем</p>

        <div class="letters-grid" id="lettersGrid">
          <!-- Letters will be generated here -->
        </div>
      </main>
    </div>

    <!-- Letter Modal -->
    <div class="letter-modal" id="letterModal" style="display: none;">
      <div class="letter-modal-inner">
        <button class="letter-modal-close" type="button">×</button>
        <div class="letter-content" id="letterContent"></div>
      </div>
    </div>

    <script src="content.js"></script>
    <script src="app.js"></script>
    <script src="letters.js"></script>
  </body>
</html>
